version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ailogix-backend
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - FASTAPI_URL=http://ml-service:8000
      - NODE_ENV=production
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - ml-service
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ailogix-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ailogix-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
